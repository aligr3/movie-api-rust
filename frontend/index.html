<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Collection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .controls {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .controls h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 0.9rem;
        }

        input {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .movie-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .movie-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .movie-id {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .movie-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            padding-right: 60px;
        }

        .movie-tagline {
            color: #666;
            font-style: italic;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
            margin-top: 15px;
        }

        .movie-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-item {
            font-size: 0.85rem;
            color: #888;
        }

        .info-value {
            font-weight: 600;
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
            font-size: 1.2rem;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .empty-state svg {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: #666;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #999;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.show {
            display: flex;
        }

        .toast.success {
            border-left: 4px solid #4caf50;
        }

        .toast.error {
            border-left: 4px solid #f44336;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .movies-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Movie Collection</h1>
            <p class="subtitle">Verwalte deine Filmsammlung</p>
        </header>

        <div class="controls">
            <h2>➕ Neuen Film hinzufügen</h2>
            <form id="addMovieForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="title">Titel *</label>
                        <input type="text" id="title" required placeholder="z.B. Inception">
                    </div>
                    <div class="form-group">
                        <label for="tagline">Tagline</label>
                        <input type="text" id="tagline" placeholder="z.B. Your mind is the scene...">
                    </div>
                    <div class="form-group">
                        <label for="vote_average">Durchschnittsbewertung</label>
                        <input type="number" id="vote_average" step="0.1" min="0" max="10" placeholder="z.B. 8.5">
                    </div>
                    <div class="form-group">
                        <label for="vote_count">Anzahl Bewertungen</label>
                        <input type="number" id="vote_count" min="0" placeholder="z.B. 1234">
                    </div>
                    <div class="form-group">
                        <label for="popularity">Popularität</label>
                        <input type="number" id="popularity" step="0.01" placeholder="z.B. 67.5">
                    </div>
                    <div class="form-group">
                        <label for="release_date">Veröffentlichungsdatum</label>
                        <input type="date" id="release_date">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">
                    <span>✨</span> Film hinzufügen
                </button>
            </form>
        </div>

        <div id="moviesContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Lade Filme...</p>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <span id="toastMessage"></span>
    </div>

    <script>
        const API_BASE = '/api';
        let movies = [];

        async function loadMovies() {
            try {
                const response = await fetch(`${API_BASE}/movies`);
                movies = await response.json();
                renderMovies();
            } catch (error) {
                console.error('Error loading movies:', error);
                showToast('Fehler beim Laden der Filme', 'error');
            }
        }

        function renderMovies() {
            const container = document.getElementById('moviesContainer');
            
            if (movies.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2z" stroke-width="2"/>
                            <path d="M12 8v4m0 4h.01" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <h3>Keine Filme gefunden</h3>
                        <p>Füge deinen ersten Film hinzu!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="movies-grid">
                ${movies.map((movie, index) => `
                    <div class="movie-card">
                    <div class="movie-id">#${index + 1}</div> <!-- dynamische Nummer -->
                    <h3 class="movie-title">${escapeHtml(movie.title)}</h3>
                    ${movie.tagline ? `<p class="movie-tagline">"${escapeHtml(movie.tagline)}"</p>` : ''}
                    <div class="movie-meta">
                        <div class="movie-info">
                        ${movie.vote_average ? `
                            <div class="info-item">
                            ⭐ <span class="info-value">${movie.vote_average.toFixed(1)}</span>
                            </div>
                        ` : ''}
                        ${movie.vote_count ? `
                            <div class="info-item">
                            👥 <span class="info-value">${movie.vote_count} Stimmen</span>
                            </div>
                        ` : ''}
                        ${movie.popularity ? `
                            <div class="info-item">
                            🔥 <span class="info-value">${movie.popularity.toFixed(1)}</span>
                            </div>
                        ` : ''}
                        ${movie.release_date ? `
                            <div class="info-item">
                            📅 <span class="info-value">${formatDate(movie.release_date)}</span>
                            </div>
                        ` : ''}
                        </div>
                        <button class="btn btn-danger" onclick="deleteMovie(${movie.id})">
                        🗑️ Löschen
                        </button>
                    </div>
                    </div>
                `).join('')}
                </div>

            `;
        }

        async function deleteMovie(id) {
            if (!confirm('Möchtest du diesen Film wirklich löschen?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/movies/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showToast('Film erfolgreich gelöscht!', 'success');
                    await loadMovies();
                } else {
                    showToast('Fehler beim Löschen des Films', 'error');
                }
            } catch (error) {
                console.error('Error deleting movie:', error);
                showToast('Fehler beim Löschen des Films', 'error');
            }
        }

        document.getElementById('addMovieForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const movie = {
                title: document.getElementById('title').value,
                tagline: document.getElementById('tagline').value || null,
                vote_average: document.getElementById('vote_average').value ? parseFloat(document.getElementById('vote_average').value) : null,
                vote_count: document.getElementById('vote_count').value ? parseInt(document.getElementById('vote_count').value) : null,
                popularity: document.getElementById('popularity').value ? parseFloat(document.getElementById('popularity').value) : null,
                release_date: document.getElementById('release_date').value || null
            };

            try {
                console.log('Sending movie:', movie);
                
                const response = await fetch(`${API_BASE}/movies`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(movie)
                });

                console.log('Response status:', response.status);
                const responseText = await response.text();
                console.log('Response body:', responseText);

                if (response.ok) {
                    showToast('Film erfolgreich hinzugefügt!', 'success');
                    e.target.reset();
                    await loadMovies();
                } else {
                    showToast(`Fehler beim Hinzufügen des Films: ${response.status}`, 'error');
                }
            } catch (error) {
                console.error('Error adding movie:', error);
                showToast('Fehler beim Hinzufügen des Films', 'error');
            }
        });

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            toast.className = `toast ${type} show`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('de-DE', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        loadMovies();
    </script>
</body>
</html>
